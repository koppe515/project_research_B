services:
  ndn-main:
    build: .
    image: my-ndn-image
    container_name: ndn-main
    tty: true
    working_dir: /workspace
    ports: # ポートフォワーディング
      - "6363:6363/udp"   # 外部とのNDN通信窓口をここに集中
      - "6363:6363/tcp"
    volumes:
      - ./workspace:/workspace
    networks:
      - ndn-network

  ndn-sub:
    build: .
    image: my-ndn-image
    container_name: ndn-sub
    tty: true
    working_dir: /workspace
    # 外部公開（ports）は書かず、内部テスト専用にする
    volumes:
      - ./workspace:/workspace
    networks:
      - ndn-network

networks:
  ndn-network: