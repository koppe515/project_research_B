# 2つのコンテナを別々のNFDとして動かしつつ外部とも通信
services:
  ndn-producer:
    build: .
    image: my-ndn-image
    container_name: ndn-producer
    tty: true
    working_dir: /workspace
    ports:
      - "6363:6363/udp"         # ← 外部からのNDN通信（UDP）をこのコンテナへ転送
      - "6363:6363/tcp"         # ← 外部からのNDN通信（TCP）をこのコンテナへ転送
    volumes:
      - ./workspace:/workspace
    networks:
      - ndn-network

  ndn-consumer:
    build: .
    image: my-ndn-image
    container_name: ndn-consumer
    tty: true
    working_dir: /workspace
    ports:
      - "16363:6363/udp"        # ← 外部からconsumerに直接繋ぐ場合は別ポート(16363)で受ける
      - "16363:6363/tcp"
    volumes:
      - ./workspace:/workspace
    networks:
      - ndn-network

networks:
  ndn-network: